[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jparacrawl-filtering"
version = "0.1.0"
description = "Resumable Japanese-English text filtering for direct speech translation research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["pyarrow>=17,<24", "PyYAML>=6,<7", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
lid = ["fasttext-wheel>=0.9.2,<0.10", "numpy>=1.26,<2"]
scoring = ["bicleaner-ai>=3.4,<4; sys_platform == 'linux'"]
cuda = ["bicleaner-ai[and-cuda]>=3.4,<4; sys_platform == 'linux'"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6"]

[project.scripts]
jparacrawl-filtering = "jparacrawl_filtering.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
